[build]
  publish = "public"
  # Only the main branch is ever built and published. Any other branch (e.g. dev) is skipped,
  # so work-in-progress pushes cost no deploy credits.
  ignore = "[ \"$BRANCH\" != \"main\" ]"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
