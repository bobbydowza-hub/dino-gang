<title>Dino Gang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one narrow column. Home = tiles for each set. Session = progress bar, one big card, sticky answer bar. Reward = pompoms. */
:root {
  --bg: #f4f5fb;
  --surface: #ffffff;
  --ink: #272650;
  --ink-soft: #62648a;
  --on-accent: #272650;
  --focus: #0b6aa8;
  --outline: #212121;
  --tile-soft: #4b4d74;
  --good-ink: #1a6b3d;
  --line: #e0e2f0;
  --sky: #2fa8f0; --sky-lip: #1b7fc2;
  --good: #34b56b; --good-lip: #228a4f; --good-bg: #dff6e8;
  --warn: #ffb21f; --warn-lip: #d68a00; --warn-ink: #3a2700; --warn-bg: #fff0d1;
  --t1: #ffd0e1; --t1l: #eba3be;
  --t2: #ffeaa0; --t2l: #e6c867;
  --t3: #b4f1ec; --t3l: #7fd2cb;
  --t4: #d8ccff; --t4l: #a998ee;
  --t5: #ffd6b4; --t5l: #eba878;
  --font-ui: "Figtree", "Trebuchet MS", system-ui, sans-serif;
  --font-card: "Andika", "Figtree", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15162e; --surface: #1f2142; --ink: #f0f0ff; --ink-soft: #aab0d6; --focus: #3cb6ff; --outline: #f5f5f5; --on-accent: #15162e; --tile-soft: #d3d6f0; --good-ink: #43c97b; --line: #343867;
    --sky: #3cb6ff; --sky-lip: #1e82c9; --good: #43c97b; --good-lip: #26914f; --good-bg: #173a2a;
    --warn: #ffbe3b; --warn-lip: #c98600; --warn-ink: #2d1f00; --warn-bg: #3d2f10;
    --t1: #6e2f4c; --t1l: #4a1f33; --t2: #6d5a14; --t2l: #483b0a; --t3: #1b5753; --t3l: #103a37;
    --t4: #4a3f8a; --t4l: #30285c; --t5: #70401c; --t5l: #4a2810; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15162e; --surface: #1f2142; --ink: #f0f0ff; --ink-soft: #aab0d6; --focus: #3cb6ff; --outline: #f5f5f5; --on-accent: #15162e; --tile-soft: #d3d6f0; --good-ink: #43c97b; --line: #343867;
  --sky: #3cb6ff; --sky-lip: #1e82c9; --good: #43c97b; --good-lip: #26914f; --good-bg: #173a2a;
  --warn: #ffbe3b; --warn-lip: #c98600; --warn-ink: #2d1f00; --warn-bg: #3d2f10;
  --t1: #6e2f4c; --t1l: #4a1f33; --t2: #6d5a14; --t2l: #483b0a; --t3: #1b5753; --t3l: #103a37;
  --t4: #4a3f8a; --t4l: #30285c; --t5: #70401c; --t5l: #4a2810; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.45; padding-inline: 16px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); touch-action: manipulation; }
.app { max-width: 480px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; min-height: calc(100vh - 24px); min-height: calc(100dvh - 24px - env(safe-area-inset-bottom, 0px)); }
[hidden] { display: none !important; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.pagetitle { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; }
.logo { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; font: 700 1.05rem var(--font-ui); color: var(--ink); cursor: pointer; border-radius: 12px; min-height: 44px; }
.logo img { width: 36px; height: 36px; flex: none; border-radius: 10px; }
.coverlogo { display: block; margin: 0 auto; width: min(38vw, 150px); height: auto; }
.wdino { position: absolute; right: 10px; bottom: 6px; height: calc(100% - 22px); max-height: 110px; width: auto; filter: drop-shadow(0 3px 3px rgba(39,38,80,.22)); pointer-events: none; }
.tile.hasdino .name, .tile.hasdino .what { padding-right: 92px; }
.sumdino { height: 120px; width: auto; filter: drop-shadow(0 4px 4px rgba(39,38,80,.2)); }
.logo:disabled { cursor: default; }
.menu { position: absolute; top: 52px; right: 0; z-index: 25; min-width: 240px; display: flex; flex-direction: column; gap: 2px; padding: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 6px 0 var(--line); }
.menu button { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border: 0; border-radius: 12px; background: none; text-align: left; font: 600 1.05rem var(--font-ui); color: var(--ink); cursor: pointer; }
.menu button:hover:not(:disabled) { background: var(--bg); }
.menu button[aria-current="true"] { background: var(--bg); }
.menu button:disabled { color: var(--ink-soft); cursor: default; }
.menu small { font-weight: 400; font-size: 0.8rem; color: var(--ink-soft); white-space: nowrap; }
.wizlist { display: flex; flex-direction: column; gap: 14px; }
.wizlist .tile { min-height: 124px; }
.tile .glyph { position: absolute; top: 12px; right: 16px; font-family: var(--font-card); font-weight: 700; font-size: 2.2rem; line-height: 1; opacity: 0.85; }
@media (max-width: 359px) { .logo span { display: none; } }
.icon { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink-soft); cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.icon:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.icon svg { width: 22px; height: 22px; }
.pp { flex: none; display: flex; align-items: center; gap: 4px; padding: 2px 12px 2px 4px; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 700; font-variant-numeric: tabular-nums; height: 44px; }
.pp svg { width: 34px; height: 34px; }
.pp.bump { animation: bump 0.35s; }
@keyframes bump { 40% { transform: scale(1.18); } }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* home */
.lead { margin: 0; color: var(--ink-soft); font-size: 1.05rem; text-wrap: balance; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; text-align: left; border: 0; border-radius: 22px; padding: 16px 14px 14px; min-height: 148px; color: var(--ink); font-family: var(--font-ui); cursor: pointer; background: var(--c); box-shadow: 0 6px 0 var(--l); }
.tile:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--l); }
.tile:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 120px; }
.tile .glyph.long { font-size: 1.15rem; top: 16px; letter-spacing: 0.04em; }
.tile:has(.glyph.long) .name { padding-right: 96px; }
.tile .name { font-size: 1.3rem; font-weight: 700; line-height: 1.15; padding-right: 36px; }
.tile .what { font-size: 0.85rem; color: var(--tile-soft); line-height: 1.3; padding-right: 20px; }
.tile .fluff { position: absolute; top: 10px; right: 8px; width: 40px; height: 40px; }
.meter { margin-top: auto; display: flex; align-items: flex-end; gap: 10px; }
.jar { flex: none; width: 56px; height: 64px; color: var(--ink); }
.meter span.n { color: var(--ink); font-size: 0.85rem; font-weight: 500; line-height: 1.25; font-variant-numeric: tabular-nums; padding-bottom: 4px; }
.tile.soon { cursor: default; opacity: 0.72; }
.tile.soon:active { transform: none; box-shadow: 0 6px 0 var(--l); }
.tip { margin: 0; padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); font-size: 0.92rem; color: var(--ink-soft); }
.tip b { color: var(--ink); font-weight: 600; }
.link { background: none; border: 0; padding: 6px 0; font: inherit; font-size: 0.9rem; color: var(--ink-soft); text-decoration: underline; cursor: pointer; align-self: flex-start; }

/* session */
.sbar { display: flex; align-items: center; gap: 12px; }
.sbar .icon { width: 44px; height: 44px; }
.prog { flex: 1; height: 16px; border-radius: 999px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--good); transition: width 0.35s; position: relative; }
.prog i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.35); }
.setname { margin: 0; text-align: center; color: var(--ink-soft); font-size: 0.9rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
.stage { perspective: 1200px; display: flex; flex: 1 1 200px; min-height: 200px; max-height: 560px; }
.card { position: relative; width: 100%; flex: 1; cursor: pointer; border-radius: 28px; }
.inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(.3, .7, .3, 1); }
.card.flipped .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; min-width: 0; text-align: center; background: var(--surface); border: 2px solid var(--line); border-radius: 28px; box-shadow: 0 7px 0 var(--line); backface-visibility: hidden; -webkit-backface-visibility: hidden; font-family: var(--font-card); }
.face.back { transform: rotateY(180deg); }
.big { font-size: clamp(6rem, 44vw, 14rem); line-height: 1; font-weight: 400; overflow-wrap: anywhere; }
.big.word { font-size: clamp(3.6rem, 19vw, 6.4rem); }
.big .mark { color: #ff5c4d; font-weight: 700; }
.hint { font-family: var(--font-ui); font-size: 1rem; color: var(--ink-soft); }
.tapnote { position: absolute; bottom: 16px; font-family: var(--font-ui); font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-soft); }
.sock1 { display: inline-block; width: 1.6em; height: 1.6em; vertical-align: -0.3em; }
.pic { font-size: clamp(3rem, 16vw, 4.6rem); line-height: 1; }
.mn { font-weight: 600; font-size: 1.55rem; text-wrap: balance; }
.mn.cp { font-size: 1.05rem; font-weight: 400; color: var(--ink-soft); }
.tipline { font-family: var(--font-ui); font-size: 0.95rem; color: var(--ink-soft); max-width: 30ch; text-wrap: balance; }
.small-g { font-size: clamp(2rem, 11vw, 3rem); line-height: 1; font-weight: 700; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { font-size: 1.8rem; font-weight: 700; padding: 2px 14px; border-radius: 14px; background: var(--t2); color: var(--ink); box-shadow: 0 3px 0 var(--t2l); }

.hear { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 0 22px 0 18px; min-height: 56px; font: 600 1.05rem var(--font-ui); color: var(--on-accent); background: var(--sky); box-shadow: 0 4px 0 var(--sky-lip); cursor: pointer; }
.pill:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky-lip); }
.pill svg { width: 22px; height: 22px; }

.dock { position: static; margin-inline: -16px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 2px solid var(--line); margin-top: auto; }
.dock .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 480px; margin-inline: auto; }
.btn { border: 0; border-radius: 18px; padding: 15px 14px; font: 700 1.15rem var(--font-ui); letter-spacing: 0.02em; text-transform: uppercase; color: var(--on-accent); background: var(--c); box-shadow: 0 5px 0 var(--l); cursor: pointer; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--l); }
.btn.sky { --c: var(--sky); --l: var(--sky-lip); }
.btn.good { --c: var(--good); --l: var(--good-lip); }
.btn.warn { --c: var(--warn); --l: var(--warn-lip); color: var(--warn-ink); }
.btn.wide { grid-column: 1 / -1; }
.banner { max-width: 480px; margin-inline: auto; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; cursor: pointer; font-weight: 600; font-size: 1.1rem; }
.banner.good { background: var(--good-bg); color: var(--good-ink); }
.banner.warn { background: var(--warn-bg); color: var(--ink); }
.banner svg { width: 44px; height: 44px; flex: none; }
.banner small { display: block; font-weight: 400; font-size: 0.9rem; color: var(--ink-soft); }

/* summary */
.sum { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-top: 8px; }
.sum h2 { margin: 0; font-size: 2rem; font-weight: 700; text-wrap: balance; }
.sum p { margin: 0; color: var(--ink-soft); font-size: 1.1rem; }
.heap { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 0; max-width: 340px; }
.heap svg { width: 56px; height: 56px; margin-inline: -4px; }
.sum .actions { display: grid; gap: 12px; width: 100%; margin-top: 8px; }

.dock.wait .btn { opacity: 0.6; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.icon.holding { background: linear-gradient(var(--line), var(--line)) bottom/100% 0% no-repeat var(--surface); animation: holdfill 1s linear forwards; }
@keyframes holdfill { to { background-size: 100% 100%; } }
.tipnote { position: absolute; top: 56px; right: 0; background: var(--ink); color: var(--bg); font-size: 0.8rem; padding: 4px 8px; border-radius: 8px; white-space: nowrap; z-index: 5; }
.top { position: relative; }
@media (orientation: landscape) and (max-height: 520px) {
  .app { max-width: 880px; }
  .big { font-size: clamp(4rem, 22vh, 8rem); }
  #session { display: grid !important; grid-template-columns: minmax(0, 1fr) minmax(240px, 320px); grid-template-rows: auto auto 1fr auto; gap: 8px 16px; align-items: stretch; }
  .sbar { grid-column: 1 / -1; }
  .setname { display: none; }
  .stage { grid-column: 1; grid-row: 2 / span 3; max-height: none; min-height: 0; }
  .hear { grid-column: 2; grid-row: 2; align-self: start; }
  .dock { grid-column: 2; grid-row: 4; align-self: end; margin: 0; padding: 0; border: 0; background: none; }
}

/* effects */
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.fly { position: fixed; left: 0; top: 0; width: 56px; height: 56px; will-change: transform; }
.drop { position: fixed; top: -80px; width: 56px; height: 56px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(115vh) rotate(300deg); } }

/* voice sheet */
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(20, 20, 50, 0.5); }
.sheet .panel { width: 100%; max-width: 480px; background: var(--surface); border-radius: 26px 26px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font-size: 1.3rem; }
.vrow { display: flex; align-items: center; gap: 10px; }
.vrow label { min-width: 3.6rem; font-weight: 500; }
.vrow select { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.vrow input[type="range"] { flex: 1; min-width: 0; }
.vrow output { min-width: 3.2rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.chk { display: flex; gap: 10px; align-items: center; font-weight: 500; }
.chk input { width: 22px; height: 22px; }
.vnote { margin: 0; color: var(--ink-soft); font-size: 0.85rem; }

@media (prefers-reduced-motion: reduce) {
  .inner, .prog i { transition: none; }
  .pp.bump { animation: none; }
}
.nb { display: block; max-width: 100%; height: auto; }
.numchip { font-family: var(--font-card); font-weight: 700; font-size: clamp(3.4rem, 18vw, 5.2rem); line-height: 1; padding: 0.12em 0.42em; border: 4px solid; border-radius: 22px; background: var(--surface); color: var(--ink); }
.numchip.sm { font-size: clamp(2.2rem, 11vw, 3rem); border-width: 3px; }
.eq { font-family: var(--font-card); font-weight: 700; font-size: clamp(1.9rem, 9.5vw, 2.8rem); letter-spacing: 0.02em; white-space: nowrap; }
.eq .q { color: var(--ink); background: var(--warn); border-radius: 10px; padding: 0 0.3em; }
.qhint { font-family: var(--font-ui); font-size: 1rem; color: var(--ink-soft); }
.irow { display: flex; justify-content: center; gap: 0.05em; }
.it { display: inline-flex; flex-direction: column; align-items: center; font-size: clamp(2rem, 10.5vw, 3.1rem); line-height: 1.1; }
.it .ix { font-family: var(--font-card); font-weight: 700; font-size: 0.34em; line-height: 1.2; color: var(--ink); margin-top: 0.15em; }
.fing { width: min(100%, 300px); height: auto; }
.pic.rows { white-space: pre-line; font-size: clamp(2.4rem, 13vw, 3.6rem); line-height: 1.15; }

/* Menu animations (switched off for reduced motion) */
@media (prefers-reduced-motion: no-preference) {
  @keyframes dg-rise { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: none; } }
  @keyframes dg-pop { 0% { opacity: 0; transform: scale(0.8) rotate(-4deg); } 60% { opacity: 1; transform: scale(1.06) rotate(2deg); } 100% { transform: none; } }
  @keyframes dg-fade { from { opacity: 0; } to { opacity: 1; } }
  #cover:not([hidden]), #home:not([hidden]), #zone:not([hidden]) { animation: dg-fade 0.3s ease both; }
  #wizlist .tile, #tiles .tile, .zgrid .ztile, .ztog .zt-b { animation: dg-rise 0.45s cubic-bezier(.2,.8,.3,1) both; }
  #wizlist .tile:nth-child(2), #tiles .tile:nth-child(2), .zgrid .ztile:nth-child(2) { animation-delay: 0.07s; }
  #wizlist .tile:nth-child(3), #tiles .tile:nth-child(3), .zgrid .ztile:nth-child(3) { animation-delay: 0.14s; }
  #wizlist .tile:nth-child(4), #tiles .tile:nth-child(4), .zgrid .ztile:nth-child(4) { animation-delay: 0.21s; }
  #wizlist .tile:nth-child(5), #tiles .tile:nth-child(5), .zgrid .ztile:nth-child(5) { animation-delay: 0.28s; }
  #wizlist .tile:nth-child(n+6), #tiles .tile:nth-child(n+6), .zgrid .ztile:nth-child(n+6) { animation-delay: 0.35s; }
  .coverlogo { animation: dg-pop 0.7s cubic-bezier(.2,.8,.3,1) both; }
  .logo img { transition: transform 0.25s; } .logo:hover img { transform: rotate(-6deg) scale(1.08); }
  @media (hover: hover) {
    #wizlist .tile:not(:disabled), #tiles .tile:not(:disabled), .ztile { transition: transform 0.18s; }
    #wizlist .tile:not(:disabled):hover, #tiles .tile:not(:disabled):hover, .ztile:hover { transform: translateY(-3px); }
    #wizlist .tile:hover .glyph { transform: scale(1.08) rotate(-3deg); }
  }
  #wizlist .tile .glyph { transition: transform 0.2s; display: inline-block; }
  #wizlist .tile:active, #tiles .tile:active, .ztile:active, .zrow:active { transform: translateY(2px) scale(0.99); }
}
/* Language Wizards */
.swatch { width: min(62%, 220px); aspect-ratio: 1; border-radius: 28px; border: 3px solid var(--outline); }
.vwrap { flex: 1 1 0; min-height: 0; width: auto; max-width: 86%; max-height: 300px; aspect-ratio: 1; border-radius: 22px; overflow: hidden; border: 3px solid var(--outline); background: #000; }
.lvid, .lpic { width: 100%; height: 100%; object-fit: cover; display: block; }
.lpic { width: min(86%, 300px); height: auto; aspect-ratio: 1; border-radius: 22px; border: 3px solid var(--outline); }
.lq ~ .tapnote { position: static; margin-top: 2px; }
.lq { font-family: var(--font-card); font-weight: 600; font-size: 1.3rem; text-align: center; text-wrap: balance; max-width: 90%; }
.zh { font-size: 1.15rem; margin: 6px 0 0; }
.zgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.ztile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 96px; padding: 8px; border: 2px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 4px 0 var(--line); color: var(--ink); font: inherit; cursor: pointer; }
.ztile .za { font-size: 2.1rem; line-height: 1.1; }
.ztile .zn { font-family: var(--font-card); font-weight: 700; font-size: 2.2rem; line-height: 1.1; }
.ztile .zsw { width: 38px; height: 38px; border-radius: 12px; border: 2px solid var(--outline); }
.ztile .zw { font-family: var(--font-ui); font-weight: 600; font-size: 0.85rem; text-align: center; }
.zart { display: flex; justify-content: center; align-items: center; min-height: 150px; }
.zart .pic { font-size: clamp(4rem, 22vw, 6rem); }
.zart .swatch { width: min(40%, 150px); }
.zrow { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 10px 16px; border: 2px solid var(--line); border-radius: 20px; color: var(--ink); font: inherit; text-align: left; cursor: pointer; box-shadow: 0 4px 0 var(--line); }

  // ---- Pompom drawing ----
  function pompomSVG(color, seed) {
    var h = '<svg viewBox="0 0 100 100" aria-hidden="true">';
    var dark = "color-mix(in srgb, " + color + " 80%, #3a0a2a)";
    var light = "color-mix(in srgb, " + color + " 62%, #ffffff)";
    var i, a, r, x, y, n = 22;
    for (i = 0; i < n; i++) {
      a = i / n * 6.2832 + (seed || 0) * 0.37; r = 34 + ((i * 7 + (seed || 0)) % 4);
      x = 50 + Math.cos(a) * r; y = 50 + Math.sin(a) * r;
      h += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="10.5" fill="' + color + '" style="fill:' + dark + '"/>';
    }
    n = 16;
    for (i = 0; i < n; i++) {
      a = i / n * 6.2832 + 0.2 + (seed || 0) * 0.21; r = 23 + ((i * 5 + (seed || 0)) % 3);
      x = 50 + Math.cos(a) * r; y = 50 + Math.sin(a) * r;
      h += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="12" fill="' + color + '"/>';
    }
    h += '<circle cx="50" cy="50" r="24" fill="' + color + '"/>';
    h += '<circle cx="40" cy="38" r="9" fill="' + color + '" style="fill:' + light + '" opacity="0.8"/>';
    h += '<circle cx="31" cy="50" r="5" fill="' + color + '" style="fill:' + light + '" opacity="0.55"/>';
    return h + "</svg>";
  }

    progress = {}; pompoms = 0; ppStore = { word: 0, number: 0, language: 0, portuguese: 0 }; save(); armed = false; $("clear").textContent = "Clear all progress and pompoms"; renderHome();
  });

  function openSheet() { $("sheet").hidden = false; $("sheetDone").focus(); }
  function closeSheet() { $("sheet").hidden = true; armed = false; $("clear").textContent = "Clear all progress and pompoms"; $("gear").focus({ preventScroll: true }); }
  (function () {
    var g = $("gear"), t = null, held = false;
    function start(e) { held = false; g.classList.add("holding"); t = setTimeout(function () { held = true; g.classList.remove("holding"); openSheet(); }, 1000); }
    function stop() { clearTimeout(t); g.classList.remove("holding"); }
    g.addEventListener("pointerdown", start);
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (n) { g.addEventListener(n, stop); });
    g.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    g.addEventListener("click", function (e) {
      if (e.detail === 0) { openSheet(); return; }
      if (!held) { var n = document.createElement("span"); n.className = "tipnote"; n.textContent = "Grown-ups: press and hold"; g.parentNode.appendChild(n); setTimeout(function () { n.remove(); }, 2200); }
      held = false;
    });
    g.setAttribute("aria-label", "Settings. Grown-ups: press and hold, or activate with a keyboard.");
  })();
  $("sheetDone").addEventListener("click", closeSheet);
  $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) closeSheet(); });
  $("sheet").addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeSheet(); return; }
    if (e.key !== "Tab") return;
    var f = [].slice.call($("sheet").querySelectorAll("select, input, button")).filter(function (x) { return !x.disabled; });
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  $("auto").addEventListener("change", function () { prefs.auto = $("auto").checked; savePrefs(); });
  $("lq").addEventListener("change", function () { prefs.lq = $("lq").value; savePrefs(); });
  $("lq").value = prefs.lq;
  $("theme").value = prefs.theme;
  $("theme").addEventListener("change", function () { prefs.theme = $("theme").value; applyTheme(); savePrefs(); });
  $("prev").addEventListener("change", function () { prefs.preview = $("prev").checked; savePrefs(); renderCover(); renderHome(); });
  $("auto").checked = prefs.auto; $("prev").checked = prefs.preview;
  if (synth) { loadVoices(); try { synth.onvoiceschanged = loadVoices; } catch (e) {} }

  $("ppIcon").innerHTML = pompomSVG(POM[0], 3);
  $("ppIcon").style.display = "inline-flex";
  $("ppIcon").firstChild.setAttribute("width", "34"); $("ppIcon").firstChild.setAttribute("height", "34");
  renderHome();
  renderCover();
  show("cover");
})();
</script>
